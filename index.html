<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Suppress harmless Vite dev WebSocket/HMR disconnect notices in sandbox iframe
      (function() {
        var origConsoleError = console.error;
        console.error = function() {
          var first = arguments[0];
          var msg = typeof first === 'string' ? first : (first && first.message ? first.message : '');
          if (msg && (msg.indexOf('WebSocket') !== -1 || msg.indexOf('[vite]') !== -1 || msg.indexOf('ws:') !== -1)) {
            return;
          }
          origConsoleError.apply(console, arguments);
        };
        window.addEventListener('error', function(event) {
          var message = event && event.message ? event.message : '';
          if (message && (message.indexOf('WebSocket') !== -1 || message.indexOf('[vite]') !== -1 || message.indexOf('ws:') !== -1)) {
            event.stopImmediatePropagation();
            event.preventDefault();
            return true;
          }
        }, true);
        window.addEventListener('unhandledrejection', function(event) {
          var reason = event && event.reason;
          var msg = reason && (reason.message || String(reason));
          if (msg && (msg.indexOf('WebSocket') !== -1 || msg.indexOf('[vite]') !== -1)) {
            event.stopImmediatePropagation();
            event.preventDefault();
          }
        }, true);
      })();
    </script>

    <script>
      // Automatically check and activate updated service worker to bypass stale browser caches
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for (var r of registrations) {
            r.update();

        });
